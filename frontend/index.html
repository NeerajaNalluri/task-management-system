<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Task Manager · Sign in</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="auth-page">
  <main class="auth-card">
    <h1 class="brand">Task Manager</h1>
    <p class="subtitle">Sign in to continue</p>

    <div class="tabs" role="tablist">
      <button class="tab active" data-portal="admin" role="tab">Admin login</button>
      <button class="tab" data-portal="user" role="tab">User login</button>
    </div>

    <form id="login-form" novalidate>
      <label for="username">Username</label>
      <input id="username" name="username" type="text" autocomplete="username" required />

      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required />

      <p id="error" class="error" hidden></p>

      <button id="submit" type="submit" class="btn btn-primary">Sign in as Admin</button>
    </form>
  </main>

  <script src="js/api.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
