<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Tasks · Task Manager</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="app role-user" data-role="user">

  <!-- ===== Sidebar ===== -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand"><span class="logo">TM</span> Task Manager</div>

    <div class="nav-label">Menu</div>
    <a class="nav-item active" href="#dashboard" data-view="dashboard"><i data-icon="home"></i> Home</a>
    <a class="nav-item" href="#tasks"><i data-icon="list"></i> Tasks <span class="count" data-count="all">0</span></a>
    <a class="nav-item" href="#deadlines-card"><i data-icon="calendar"></i> Deadlines</a>

    <div class="sidebar-footer">
      <div class="profile">
        <div class="avatar" data-initials></div>
        <div>
          <div class="profile-name" data-username>…</div>
          <div class="profile-role">Team member</div>
        </div>
      </div>
      <button class="logout-btn" data-logout><i data-icon="logout"></i> Logout</button>
    </div>
  </aside>
  <div class="backdrop" id="backdrop"></div>

  <!-- ===== Main ===== -->
  <div class="main">
    <header class="topbar">
      <button class="icon-btn menu-btn" id="menu-btn" aria-label="Open menu"><i data-icon="menu"></i></button>
      <label class="search"><i data-icon="search"></i><input id="search" type="search" placeholder="Search tasks…" /></label>
      <div class="topbar-right">
        <span class="role-pill"><i data-icon="eye"></i> Read only</span>
      </div>
    </header>

    <main class="content">
      <section class="hero">
        <div>
          <h1 data-greeting>Welcome back</h1>
          <p>Here's an overview of the team's tasks.</p>
        </div>
        <div class="notice"><i data-icon="lock"></i> You have view-only access. Contact an admin to change a task.</div>
      </section>

      <section class="stats" id="stats"></section>

      <section class="grid">
        <div class="card" id="tasks">
          <div class="card-head">
            <h3>Tasks</h3>
            <div class="filters" id="filters">
              <button class="filter active" data-filter="all">All</button>
              <button class="filter" data-filter="todo">To do</button>
              <button class="filter" data-filter="in_progress">In progress</button>
              <button class="filter" data-filter="done">Done</button>
            </div>
          </div>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>Task</th>
                  <th class="hide-sm">Assignee</th>
                  <th>Status</th>
                  <th class="hide-sm">Priority</th>
                  <th class="hide-sm">Due</th>
                </tr>
              </thead>
              <tbody id="task-rows"></tbody>
            </table>
          </div>
        </div>

        <div class="side-col">
          <div class="card" id="deadlines-card">
            <div class="card-head"><h3>Upcoming deadlines</h3></div>
            <div class="card-body"><ul class="deadlines" id="deadlines"></ul></div>
          </div>
        </div>
      </section>
    </main>
  </div>

  <div class="toast" id="toast"></div>

  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
